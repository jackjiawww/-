<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>真人桌宠</title>
<link rel="stylesheet" href="pet.css">
</head>
<body>
<div id="pet" class="has-photo" aria-label="真人桌宠，点击人物戳一戳，顶部拖动，底部喂零食">
  <div id="bubble" role="status">你好呀！右键看看 🐾</div>
  <img id="portrait" src="assets/portrait.png" alt="真人桌宠">
  <div class="drag-handle" title="按住这里移动桌宠">⠿ 拖动移动 · v0.2.0</div>
  <div id="expression" aria-label="当前表情" role="status">🙂</div>
  <div id="snack-effect" aria-hidden="true"></div>
  <div class="toolbar">
    <div class="controls"><button id="poke" type="button">👉 戳一戳</button><button id="interact" type="button">♡ 摸摸</button><button id="menu" type="button">☰ 菜单</button></div>
    <div class="snacks" aria-label="选择零食喂她">
      <button id="feed-cookie" title="喂饼干" aria-label="喂饼干">🍪</button><button id="feed-strawberry" title="喂草莓" aria-label="喂草莓">🍓</button><button id="feed-lemon" title="喂柠檬" aria-label="喂柠檬">🍋</button><button id="feed-chili" title="喂辣椒" aria-label="喂辣椒">🌶️</button><button id="feed-icecream" title="喂冰淇淋" aria-label="喂冰淇淋">🍦</button>
    </div>
    <div class="instructions">点击人物互动 · 顶部拖动 · 选择零食投喂</div>
  </div>
</div>
<script src="pet.js"></script>
</body>
</html>
